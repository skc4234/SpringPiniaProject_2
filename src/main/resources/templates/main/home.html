<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
.row {
	margin: 0px auto;
	width: 960px;
}
p {
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}
.a-link{
	cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
	<div class="row">
		<div class="col-sm-3" v-for="(vo,index) in store.list" :key="index" style="margin-top: 20px">
		  <a :href="'http://localhost:9090/food/detail?no='+vo.no">
			<div class="thumbnail">
				<img :src="vo.poster" :title="vo.address" style="width: 250px; height: 160px">
				<p>{{vo.name}}</p>
			</div>
		  </a>
		</div>
	</div>
	<div class="row text-center">
		<ul class="pagination">
			<li v-if="store.startpage>1">
				<a @click="store.move(store.startpage-1)" class="a-link">&laquo;</a>
			</li>
			<li v-for="(i,index) in store.range" :key="index" 
				:class="i==store.curpage?'active':''">
				<a @click="store.move(i)" class="a-link">{{i}}</a>
			</li>
			<li v-if="store.endpage<store.totalpage">
				<a @click="store.move(store.endpage+1)" class="a-link">&raquo;</a>
			</li>
		</ul>
	</div>
</div>
<script src="/vue/axios.js"></script>
<script src="/vue/food/foodStore.js"></script>
<script>
	const {createApp,onMounted}=Vue
	const {createPinia}=Pinia
	const foodApp=createApp({
		setup(){
			const store=userFoodStore()
			onMounted(()=>{
				store.foodListData()
			})
			return {
				store
			}
		}
	})
	foodApp.use(createPinia())
	foodApp.mount('.container')
</script>
</body>
</html>
