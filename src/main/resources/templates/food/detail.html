	width: 800px;

<body>
<div class="container">
	<div class="row">
		<table class="table">
		  <tbody>
			<tr>
				<td rowspan="8" width="40%">
					<img th:src="${vo.poster}" style="width: 300px; height: 300px">
				</td>
				<td class="text-center" colspan="2">
					<h3>[[${vo.name}]]&nbsp;<span style="color: orange;">[[${vo.score}]]</span></h3>
				</td>
			</tr>
			<tr>
				<td class="text-center success" width="10%">
					주소
				</td>
				<td class="text-center" width="50%">
					[[${vo.address}]]
				</td>
			</tr>
			<tr>
				<td class="text-center success" width="10%">
					음식종류
				</td>
				<td class="text-center" width="50%">
					[[${vo.type}]]
				</td>
			</tr>
			<tr>
				<td class="text-center success" width="10%">
					가격대
				</td>
				<td class="text-center" width="50%">
					[[${vo.price}]]
				</td>
			</tr>
			<tr>
				<td class="text-center success" width="10%">
					영업시간
				</td>
				<td class="text-center" width="50%">
					[[${vo.time}]]
				</td>
			</tr>
			<tr>
				<td class="text-center success" width="10%">
					전화번호
				</td>
				<td class="text-center" width="50%">
					[[${vo.phone}]]
				</td>
			</tr>
			<tr>
				<td class="text-center success" width="10%">
					주차
				</td>
				<td class="text-center" width="50%">
					[[${vo.parking}]]
				</td>
			</tr>
			<tr>
				<td class="text-center success" width="10%">
					테마
				</td>
				<td class="text-center" width="50%">
					[[${vo.theme}]]
				</td>
			</tr>
			<tr>
				<td colspan="3">
					[[${vo.content}]]
				</td>
			</tr>
			<tr>
				<td colspan="3" class="text-right">
					<a sec:authorize="isAuthenticated()" href="/" class="btn btn-xs btn-info">찜하기</a>
					<a sec:authorize="isAuthenticated()" href="/" class="btn btn-xs btn-warning">예약하기</a>
					<a href="/" class="btn btn-xs btn-danger">목록</a>
				</td>
			</tr>
		  </tbody>
		</table>
		<table class="table">
			<tbody>
				<tr>
					<td>
						<!-- 지도 -->
						<div id="map" style="width:100%;height:400px;"></div>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
	<div class="row" style="margin-top: 10px" id="commentId">
		
	</div>
</div>
<script src="/vue/axios.js"></script>
<script src="/vue/comment/commentStore.js"></script>
<script>
var mapContainer = document.getElementById('map'), // 지도를 표시할 div 
    mapOption = {
        center: new kakao.maps.LatLng(33.450701, 126.570667), // 지도의 중심좌표
        level: 3 // 지도의 확대 레벨
    };  

// 지도를 생성합니다    
var map = new kakao.maps.Map(mapContainer, mapOption); 

// 주소-좌표 변환 객체를 생성합니다
var geocoder = new kakao.maps.services.Geocoder();

// 주소로 좌표를 검색합니다
geocoder.addressSearch('[[${vo.address}]]', function(result, status) {

    // 정상적으로 검색이 완료됐으면 
     if (status === kakao.maps.services.Status.OK) {

        var coords = new kakao.maps.LatLng(result[0].y, result[0].x);

        // 결과값으로 받은 위치를 마커로 표시합니다
        var marker = new kakao.maps.Marker({
            map: map,
            position: coords
        });

        // 인포윈도우로 장소에 대한 설명을 표시합니다
        var infowindow = new kakao.maps.InfoWindow({
            content: '<div style="width:150px;text-align:center;padding:6px 0;">[[${vo.name}]]</div>'
        });
        infowindow.open(map, marker);

        // 지도의 중심을 결과값으로 받은 위치로 이동시킵니다
        map.setCenter(coords);
    } 
});    
</script>
