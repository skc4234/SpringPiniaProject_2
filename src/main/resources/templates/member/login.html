<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
.row {
	width: 350px;
	margin: 0px auto;
}
</style>
</head>
<body>
<div class="container">
	<div class="row">
		<h3>Login</h3>
		<table class="table">
			<tbody>
				<tr>
					<th width="20%" class="text-center">ID</th>
					<td width="80%">
						<input type="text" name="userid" size="20" class="input-sm">
					</td>
				</tr>
				<tr>
					<th width="20%" class="text-center">PW</th>
					<td width="80%">
						<input type="password" name="userpwd" size="20" class="input-sm">
					</td>
				</tr>
				<tr>
					<td colspan="2" class="text-center">
						<button type="submit" class="btn btn-sm btn-success">로그인</button>
						<button type="button" class="btn btn-sm btn-danger"
								onclick="javascript:history.back()">
							취소
						</button>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
</body>
</html>
